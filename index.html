<!doctype html>
<html lang="en">
    <head>

        <title>Design Heaven - Creative Design & Tech Studio</title>

        <!-- FavIcon -->
        <link rel="icon" type="image/svg+xml" href="/images/svg/logo.svg" />

        <!-- Canonical URL -->
        <link rel="canonical" href="https://designheaven.com/" />

        <!-- Meta: Configurations -->
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
        <meta name="format-detection" content="address=no"/>
        <meta name="color-scheme" content="dark">

        <!-- Meta: SEO -->
        <meta name="description" content="Design Heaven is a creative design and digital development studio specializing in UI/UX design, modern web applications, and immersive digital experiences."/>

        <meta name="robots" content="index, follow"/>
        <meta name="googlebot" content="index, follow"/>
        <meta name="google" content="notranslate"/>

        <meta name="theme-color" content="#111111"/>

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://designheaven.com/" />
        <meta property="og:title" content="Design Heaven - Creative Design & Tech Studio" />
        <meta property="og:description" content="Design Heaven is a creative design and digital development studio specializing in UI/UX design, modern web applications, and immersive digital experiences." />
        <meta property="og:image" content="/images/pictures/og-image.jpg" />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://designheaven.com/" />

        <meta property="twitter:description" content="Design Heaven is a creative design and digital development studio specializing in UI/UX design, modern web applications, and immersive digital experiences." />
        <meta property="twitter:image" content="/images/pictures/og-image.jpg" />

        <!-- Structured Data -->
        <script type="application/ld+json">

            "@context": "https://schema.org",

        <link href="https://fonts.googleapis.com/css?family=Orbitron:400,700" rel="stylesheet" type="text/css">
